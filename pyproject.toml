[project]
name = "signassistant"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Flet developer", email = "you@example.com" }]
dependencies = [
    "ai-edge-litert>=2.2.0",
    "flet>=0.86.4",
    "flet-camera>=0.86.4",
    "flet-permission-handler>=0.86.4",
    "mediapipe>=1.0.0",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.4",
    "flet-desktop>=0.86.4",
    "flet-web>=0.86.4",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.mycompany"
product = "signassistant"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
permission = ["camera", "microphone"]
[tool.flet.app]
path = "src"
