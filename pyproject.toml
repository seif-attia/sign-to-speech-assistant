[project]
name = "Wesal"
version = "1.0.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Flet developer", email = "you@example.com" }]
dependencies = [
    "flet>=0.86.4",
    "flet-camera>=0.86.4",
    "flet-permission-handler>=0.86.4",
    "websockets",
    "requests",
    "flet-audio",
    "sherpa-onnx>=1.13.7",
    "flet-audio-recorder>=0.86.4",
    "pillow==12.2.0",
]


[tool.flet.icons]
android = "assets/icon.png"

[dependency-groups]
dev = [
    "flet-cli>=0.86.4",
    "flet-desktop>=0.86.4",
    "flet-web>=0.86.4",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.mycompany"
product = "signassistant"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
permission = ["camera", "microphone"]
[tool.flet.app]
path = "src"

[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true
"android.permission.MODIFY_AUDIO_SETTINGS" = true

[tool.flet.android]
uses_cleartext_traffic = true
adaptive_icon_background = "#ffffff"
